name: Audit Japanese public KB

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/audit-ja-public-kb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image verifier
        run: python -m pip install --quiet Pillow
      - name: Check public pages
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import subprocess
          from PIL import Image, UnidentifiedImageError

          raw = subprocess.check_output(['git', '-c', 'core.quotepath=false', 'ls-files', '-z', '*.md'])
          files = [Path(p.decode('utf-8')) for p in raw.split(b'\0') if p]
          errors = []
          warnings = []
          stable_ids = {}
          generic = re.compile(r'^#{1,6}\s+(Relevant|Compelling|Insight|Resource|Resources|Summary|Key Findings|Method|Methodology|Limitations|Caveats|Research|Data|Charts|Chart|Output|Outputs|Conclusion|Conclusions|Source|Sources|Notes)(?:\b|（|\s|$)', re.I)
          link_re = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          platform_re = re.compile(r'https://(?:app\.)?reflexivity\.com/app/', re.I)
          allowed_heading_tokens = {
              'Reflexivity','QUICK','FX','FOMC','RSI','EUR','USD','EUR/USD','S&P','IPO','NVIDIA','AAPL','RIA',
              'PM','CIO','KPI','AI','PMI','GDP','PCE','ADP','JOLTS','CAGR','OOS','ETF','WTI','FRB','Fed',
              'Company','Catalyst','Knowledge','Graph','Russell','Bitcoin','Robinhood','iPhone','Alfred'
          }

          checked_images = set()

          def verify_image(path):
              path = path.resolve()
              if path in checked_images:
                  return
              checked_images.add(path)
              suffix = path.suffix.lower()
              data = path.read_bytes()

              if suffix == '.webp':
                  if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                      errors.append(f'{path}: invalid WebP container')
                      return
                  declared = int.from_bytes(data[4:8], 'little') + 8
                  if declared != len(data):
                      errors.append(f'{path}: corrupt/truncated WebP container: declared {declared} bytes, actual {len(data)} bytes')
                      return
              elif suffix == '.png':
                  if not data.startswith(b'\x89PNG\r\n\x1a\n') or b'IEND' not in data[-32:]:
                      errors.append(f'{path}: invalid/truncated PNG container')
                      return
              elif suffix in {'.jpg', '.jpeg'}:
                  if len(data) < 4 or data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
                      errors.append(f'{path}: invalid/truncated JPEG container')
                      return

              try:
                  with Image.open(path) as im:
                      im.verify()
              except (UnidentifiedImageError, OSError, ValueError) as exc:
                  errors.append(f'{path}: image decoder verification failed: {exc}')

          def visible_text(text):
              if text.startswith('<!--'):
                  end = text.find('-->')
                  if end >= 0:
                      return text[end+3:]
              return text

          for path in files:
              text = path.read_text(encoding='utf-8')
              visible = visible_text(text)
              if visible.lstrip().startswith('---'):
                  errors.append(f'{path}: visible YAML/front matter')

              meta_end = text.find('-->') if text.startswith('<!--') else -1
              meta = text[:meta_end+3] if meta_end >= 0 else ''
              id_match = re.search(r'^id:\s*(RX-[A-Z]+-\d{4})\s*$', meta, re.M)
              if id_match:
                  stable_id = id_match.group(1)
                  previous = stable_ids.get(stable_id)
                  if previous is not None:
                      errors.append(f'duplicate stable id {stable_id}: {previous} and {path}')
                  else:
                      stable_ids[stable_id] = path

                  is_use_case = bool(re.search(r'^type:\s*use-case\s*$', meta, re.M | re.I))
                  is_partner = bool(re.search(r'^source_type:\s*partner-provided-use-case\s*$', meta, re.M | re.I))
                  if is_partner:
                      if re.search(r'^author:\s*', meta, re.M):
                          errors.append(f'{path}: partner-provided use case must not identify the provider as author in metadata')
                      if not re.search(r'^provider:\s*\S+', meta, re.M):
                          errors.append(f'{path}: partner-provided use case lacks provider metadata')
                      if re.search(r'^\*\*著者:\*\*', visible, re.M):
                          errors.append(f'{path}: partner-provided use case must not show provider as 著者')
                      if re.search(r'^\*\*想定利用者:\*\*', visible, re.M):
                          errors.append(f'{path}: use 対象ユーザー instead of 想定利用者')
                      provider_match = re.search(r'^provider:\s*(.+)', meta, re.M)
                      attribution_marks = list(re.finditer(r'^本コンテンツは、.+よりご提供いただいた.+です。', visible, re.M))
                      if len(attribution_marks) != 1:
                          errors.append(f'{path}: partner-provided use case must have exactly one natural closing provider-attribution sentence')
                      elif attribution_marks[0].start() < visible.rfind('\n## '):
                          errors.append(f'{path}: provider attribution must be in the closing area, after substantive sections')
                      if provider_match and ('本コンテンツは、' + provider_match.group(1).strip() + 'よりご提供いただいた') not in visible:
                          errors.append(f'{path}: closing provider attribution does not match provider metadata')
                      applicability = '国・地域や言語環境、利用製品、データ提供範囲などによっては、内容をそのまま適用できない場合があります。'
                      if applicability not in visible:
                          errors.append(f'{path}: partner-provided use case lacks the standard applicability qualification')
                  if is_use_case and not is_partner:
                      if not platform_re.search(visible):
                          errors.append(f'{path}: Reflexivity-created use case {stable_id} lacks visible Reflexivity platform URL')
                      else:
                          first_section = re.search(r'(?m)^##\s+', visible)
                          if first_section and not platform_re.search(visible[:first_section.start()]):
                              errors.append(f'{path}: Reflexivity-created use case {stable_id} places the primary Reflexivity CTA too low; put it before the first section heading')

              if re.search(r'^source_url:\s*["\']?https?://(?:www\.)?reflexivity\.com', meta, re.M | re.I):
                  errors.append(f'{path}: Reflexivity customer navigation URL is hidden in metadata; move it to the visible body')

              for n, line in enumerate(visible.splitlines(), 1):
                  if generic.match(line.strip()):
                      errors.append(f'{path}:{n}: generic English editorial heading: {line.strip()}')
                  if line.startswith('#'):
                      heading = re.sub(r'[#*_`]', ' ', line)
                      words = re.findall(r"[A-Za-z][A-Za-z0-9/&.-]*", heading)
                      suspicious = [w for w in words if w not in allowed_heading_tokens and not w.isupper() and len(w) > 2]
                      if suspicious:
                          warnings.append(f'{path}:{n}: review heading language: {line.strip()}')

              for m in link_re.finditer(visible):
                  is_image = m.group(0).lstrip().startswith('![')
                  target = m.group(1).strip()
                  if target.startswith('<') and target.endswith('>'):
                      target = target[1:-1]
                  if not target or target.startswith(('http://','https://','mailto:','#','tel:')):
                      continue
                  target = target.split('#',1)[0].split('?',1)[0]
                  if not target:
                      continue
                  resolved = (path.parent / unquote(target)).resolve()
                  try:
                      resolved.relative_to(Path('.').resolve())
                  except ValueError:
                      errors.append(f'{path}: local link escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      errors.append(f'{path}: broken local link/image: {target}')
                  elif is_image:
                      verify_image(resolved)

          if Path('.tmp').exists():
              leftovers = [str(p) for p in Path('.tmp').rglob('*') if p.is_file()]
              if leftovers:
                  errors.append('.tmp contains publication leftovers: ' + ', '.join(leftovers))

          print(f'Markdown files checked: {len(files)}')
          print(f'Stable IDs checked: {len(stable_ids)}')
          if warnings:
              print('\nLanguage review warnings:')
              for item in warnings:
                  print('WARN', item)
          if errors:
              print('\nAudit errors:')
              for item in errors:
                  print('ERROR', item)
              raise SystemExit(1)
          print('\nAUDIT PASSED')
