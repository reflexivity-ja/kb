name: Restore Reflexivity source visuals

on:
  push:
    paths:
      - '.github/workflows/restore-reflexivity-source-visuals.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source figures and Japanese wording
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = {
              'RX-USECASE-0029': Path('ユースケース/運用資産別/債券/french-sovereign-corporate-yield-inversion-trade-ideas.md'),
              'RX-USECASE-0030': Path('ユースケース/運用資産別/債券/us-yield-curve-relative-value-screen.md'),
              'RX-USECASE-0031': Path('ユースケース/運用資産別/債券/us-2s10s-recession-signal-validation.md'),
              'RX-USECASE-0032': Path('ユースケース/運用資産別/FX/eurusd-systematic-investment-checklist.md'),
              'RX-USECASE-0033': Path('ユースケース/運用資産別/マルチアセット/bond-signals-vs-forward-equity-returns.md'),
              'RX-USECASE-0034': Path('ユースケース/運用資産別/マルチアセット/hawkish-policy-beneficiaries-knowledge-graph.md'),
              'RX-USECASE-0035': Path('ユースケース/運用資産別/マクロ/challenge-strong-us-economy-thesis.md'),
              'RX-USECASE-0036': Path('ユースケース/運用資産別/マクロ/market-narrative-vs-hard-data-breadth.md'),
              'RX-USECASE-0037': Path('ユースケース/運用資産別/FX/eurusd-rsi-walk-forward-backtest.md'),
          }

          def block(*lines):
              return '\n'.join(lines)

          blocks = {
              'RX-USECASE-0029': block('## 原Researchの構成', '', '原資料は本文・表・数値を中心に構成されているため、本ページではその内容を本文中にできる限り元の順序と粒度を保って再現しています。'),
              'RX-USECASE-0030': block('## 原Researchの構成', '', '原資料は本文・表・数値を中心に構成されているため、本ページではその内容を本文中にできる限り元の順序と粒度を保って再現しています。'),
              'RX-USECASE-0031': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![2年・10年金利差と将来のカーブ変化](../../../画像/ユースケース/reflexivity/RX-USECASE-0031/chart-1.webp)', '', '*図1: 10年・2年金利差と、その後5年・10年のカーブ変化を比較した原Researchの図表。*', '', '![景気後退シグナルの履歴検証](../../../画像/ユースケース/reflexivity/RX-USECASE-0031/chart-2.webp)', '', '*図2: 原Researchで用いた景気後退シグナルの履歴検証図。*'),
              'RX-USECASE-0032': block('## 原Researchの構成', '', '原資料は本文・表・数値を中心に構成されているため、本ページではその内容を本文中にできる限り元の順序と粒度を保って再現しています。'),
              'RX-USECASE-0033': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![債券シグナルと株式の先行リターン](../../../画像/ユースケース/reflexivity/RX-USECASE-0033/chart-1.webp)', '', '*図: 債券市場のシグナルと、その後の株式リターンの関係を観測値ごとに比較した原Researchの散布図。*'),
              'RX-USECASE-0034': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![Knowledge Graphによる波及経路](../../../画像/ユースケース/reflexivity/RX-USECASE-0034/chart-1.webp)', '', '*図: タカ派的な政策ショックからテーマ、セクター、企業へ波及する経路をKnowledge Graphで可視化した原Researchの図表。*'),
              'RX-USECASE-0035': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![米国景気の強さを反証方向から検証する主要図表](../../../画像/ユースケース/reflexivity/RX-USECASE-0035/source-figures.webp)', '', '*図: 原Researchで使用した主要な比較図と、最終的な景気局面の確率評価（Late-cycle 50%、Durable 30%、Already rolling over 20%）。*'),
              'RX-USECASE-0036': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![市場ナラティブとハードデータの主要図表](../../../画像/ユースケース/reflexivity/RX-USECASE-0036/source-figures.webp)', '', '*図: 経済指標の実績対コンセンサスと、テーマ別の1カ月リターンを比較した原Researchの主要図表。*'),
              'RX-USECASE-0037': block('## 原Researchの図表', '', '原Researchに含まれていた主要な図表を、元資料から抽出して掲載しています。', '', '![EUR/USD RSI戦略とBuy & Holdの比較](../../../画像/ユースケース/reflexivity/RX-USECASE-0037/chart-1.webp)', '', '*図: RSI-14・20/80・crossback戦略のネット成長率とEUR/USD Buy & Holdを比較した原Researchの図表。*'),
          }

          section = re.compile(r'## 原Researchの出力イメージ\n.*?(?=\n## )', re.S)

          for rid, md in docs.items():
              text = md.read_text(encoding='utf-8')
              text, n = section.subn(blocks[rid], text, count=1)
              if n != 1:
                  raise SystemExit(f'Expected one source-image section in {md}, found {n}')
              text = text.replace('反証、制約、最終的な読み', '反証、前提・留意点、最終的な読み')
              text = text.replace('## Limitations & Caveats', '## 前提・留意点')
              text = text.replace('## Important Data Limitation', '## 重要なデータ上の留意点')
              text = text.replace('## 重要なData Limitation', '## 重要なデータ上の留意点')
              text = text.replace('## Data Limitations', '## データ上の留意点')
              text = text.replace('## Limitations', '## 分析上の留意点')
              text = text.replace('どこにLimitationsを置いたか', 'どの前提・留意点を明示したか')
              text = text.replace('Limitationsを置いたか', '前提・留意点を明示したか')
              md.write_text(text, encoding='utf-8')

          root = Path('画像/ユースケース/reflexivity')
          for name in ('source-visuals.svg', 'source-visuals.webp', 'source-pages.webp'):
              for p in root.rglob(name):
                  p.unlink()
          old_0037 = root / 'RX-USECASE-0037'
          for p in old_0037.glob('page-*.webp'):
              p.unlink()

          Path('.github/workflows/restore-reflexivity-source-visuals.yml').unlink()

      - name: Commit repaired publication assets
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore Reflexivity research figures and Japanese caveat wording"
          git push
