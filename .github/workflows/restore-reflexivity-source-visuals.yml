name: Restore Reflexivity source visuals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source visuals and Japanese caveat wording
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = {
            'RX-USECASE-0029': Path('ユースケース/運用資産別/債券/french-sovereign-corporate-yield-inversion-trade-ideas.md'),
            'RX-USECASE-0030': Path('ユースケース/運用資産別/債券/us-yield-curve-relative-value-screen.md'),
            'RX-USECASE-0031': Path('ユースケース/運用資産別/債券/us-2s10s-recession-signal-validation.md'),
            'RX-USECASE-0032': Path('ユースケース/運用資産別/FX/eurusd-systematic-investment-checklist.md'),
            'RX-USECASE-0033': Path('ユースケース/運用資産別/マルチアセット/bond-signals-vs-forward-equity-returns.md'),
            'RX-USECASE-0034': Path('ユースケース/運用資産別/マルチアセット/hawkish-policy-beneficiaries-knowledge-graph.md'),
            'RX-USECASE-0035': Path('ユースケース/運用資産別/マクロ/challenge-strong-us-economy-thesis.md'),
            'RX-USECASE-0036': Path('ユースケース/運用資産別/マクロ/market-narrative-vs-hard-data-breadth.md'),
            'RX-USECASE-0037': Path('ユースケース/運用資産別/FX/eurusd-rsi-walk-forward-backtest.md'),
          }

          for rid, md in docs.items():
              text = md.read_text(encoding='utf-8')
              if rid != 'RX-USECASE-0037':
                  old = re.compile(r'!\[[^\n]*Reflexivity Research原資料\]\([^\n]*\)')
                  replacement = f'![{rid} Reflexivity Research 原資料](../../../画像/ユースケース/reflexivity/{rid}/source-pages.webp)'
                  text, n = old.subn(replacement, text, count=1)
                  if n == 0:
                      text = text.replace(f'../../../画像/ユースケース/reflexivity/{rid}/source-visuals.webp', f'../../../画像/ユースケース/reflexivity/{rid}/source-pages.webp')
                      text = text.replace(f'../../../画像/ユースケース/reflexivity/{rid}/source-visuals.svg', f'../../../画像/ユースケース/reflexivity/{rid}/source-pages.webp')
              text = text.replace('## Limitations', '## 分析上の留意点')
              text = text.replace('## Data Limitations', '## データ上の留意点')
              text = text.replace('## Important Data Limitation', '## 重要なデータ上の留意点')
              text = text.replace('## 重要なData Limitation', '## 重要なデータ上の留意点')
              text = text.replace('Limitationsを置いたか', '前提や留意点を明示したか')
              text = text.replace('Limitationsを', '留意点を')
              md.write_text(text, encoding='utf-8')

          # Remove stale broken Reflexivity wrapper assets if they exist; the real source-page WebP files remain.
          root = Path('画像/ユースケース/reflexivity')
          for p in root.rglob('source-visuals.svg'):
              p.unlink()
          for p in root.rglob('source-visuals.webp'):
              if p.parent.name != 'RX-USECASE-0037':
                  p.unlink()

          Path('.github/workflows/restore-reflexivity-source-visuals.yml').unlink()
      - name: Commit repaired publication assets
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore Reflexivity research visuals and localize caveat wording"
          git push
