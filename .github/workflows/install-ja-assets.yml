name: Restore RX-USECASE-0059 source visuals

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify original 0059 WebP assets
        shell: python
        run: |
          from pathlib import Path
          import base64, binascii, string, struct, subprocess, zlib

          expected = {
              '画像/ユースケース/quick/RX-USECASE-0059/01-normalized-asset-paths.webp',
              '画像/ユースケース/quick/RX-USECASE-0059/02-scenario-ranges.webp',
              '画像/ユースケース/quick/RX-USECASE-0059/03-risk-return-map.webp',
          }
          found = {}

          def scan_zip_bytes(data, label):
              sig = b'PK\x03\x04'
              pos = 0
              while True:
                  i = data.find(sig, pos)
                  if i < 0:
                      break
                  pos = i + 4
                  if i + 30 > len(data):
                      continue
                  _, ver, flags, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<IHHHHHIIIHH', data, i)
                  ns = i + 30
                  ne = ns + nlen
                  ds = ne + xlen
                  if ds > len(data) or nlen == 0 or nlen > 500:
                      continue
                  try:
                      name = data[ns:ne].decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if name not in expected:
                      continue
                  payload = data[ds:ds+csize]
                  if len(payload) != csize:
                      print(label, name, 'truncated compressed payload', len(payload), '/', csize)
                      continue
                  if method == 0:
                      raw = payload
                  elif method == 8:
                      try:
                          raw = zlib.decompress(payload, -15)
                      except Exception as e:
                          print(label, name, 'deflate error', repr(e))
                          continue
                  else:
                      print(label, name, 'unsupported method', method)
                      continue
                  if len(raw) != usize:
                      print(label, name, 'size mismatch', len(raw), '/', usize)
                      continue
                  if (binascii.crc32(raw) & 0xffffffff) != crc:
                      print(label, name, 'CRC mismatch')
                      continue
                  if not (raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'):
                      print(label, name, 'invalid WebP header')
                      continue
                  declared = int.from_bytes(raw[4:8], 'little') + 8
                  if declared != len(raw):
                      print(label, name, 'RIFF length mismatch', declared, len(raw))
                      continue
                  found[name] = raw
                  print('VERIFIED', label, name, len(raw), 'bytes')

          # Fragment family containing the first 0059 asset.
          root = Path('.tmp/final-assets')
          parts = sorted(root.glob('chunk-*.b64'))
          if parts:
              alphabet = set(string.ascii_letters + string.digits + '+/=')
              text = ''.join(''.join(ch for ch in p.read_text(encoding='utf-8', errors='ignore') if ch in alphabet) for p in parts)
              text += '=' * ((4 - len(text) % 4) % 4)
              try:
                  scan_zip_bytes(base64.b64decode(text, validate=False), 'final-assets')
              except Exception as e:
                  print('final-assets decode error', repr(e))

          # Truncated ZIP still contains complete local-file records for 02/03.
          p = Path('.tmp/final-ja-assets.zip')
          if p.exists():
              scan_zip_bytes(p.read_bytes(), 'final-ja-assets.zip')

          missing = expected - found.keys()
          if missing:
              raise SystemExit('Missing verified assets: ' + ', '.join(sorted(missing)))

          for name in sorted(expected):
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(found[name])

          subprocess.run(['git','config','user.name','Reflexivity KB automation'], check=True)
          subprocess.run(['git','config','user.email','gtm@reflexivity.com'], check=True)
          subprocess.run(['git','add', *sorted(expected)], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              print('No asset changes needed.')
              raise SystemExit(0)
          subprocess.run(['git','commit','-m','Restore RX-USECASE-0059 source visuals'], check=True)
          subprocess.run(['git','push'], check=True)
