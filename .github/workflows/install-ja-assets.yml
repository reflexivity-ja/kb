name: Inspect staged Japanese KB asset archive

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List staged archive members without modifying repository
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile

          p = Path('.tmp/final-ja-assets.zip')
          if not p.exists():
              raise SystemExit('Missing .tmp/final-ja-assets.zip')
          print('archive_sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              print('testzip', bad)
              for info in z.infolist():
                  print(f'{info.filename}\tsize={info.file_size}\tcrc={info.CRC:08x}')
                  if not info.is_dir():
                      data = z.read(info.filename)
                      print('  sha256=' + hashlib.sha256(data).hexdigest())
