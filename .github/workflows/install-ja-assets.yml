name: Finalize Japanese KB publication cleanup

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove publication staging and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/inspect-quick-blob-id.yml
          rm -f .github/workflows/install-today-onboarding-assets.yml
          rm -f .github/workflows/inspect-publication-source-bundle.yml
          rm -f .github/workflows/install-ja-assets.yml

          git config user.name 'Reflexivity KB automation'
          git config user.email 'gtm@reflexivity.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git commit -m 'Clean Japanese KB publication staging'
          git push
