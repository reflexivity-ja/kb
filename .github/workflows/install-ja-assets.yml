name: Verify historical Sep 16 onboarding asset archive

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild archive from repaired historical snapshot
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, io, subprocess, zipfile

          ref = 'e256ead2887bd96b05f768bcb97966238f262f93'
          names = [
              'chunk-00.b64','chunk-01.b64','chunk-02.b64','chunk-03.b64',
              'rem-00.b64','rem-01.b64','rem-02.b64','rem-03.b64',
              'rem-04.b64','rem-05.b64','rem-06.b64','rem-07.b64',
          ]
          parts = []
          for name in names:
              path = f'.tmp/today-assets/{name}'
              data = subprocess.check_output(['git','show',f'{ref}:{path}'])
              print(name, len(data), hashlib.sha256(data).hexdigest())
              parts.append(data)

          encoded = b''.join(parts)
          raw = base64.b64decode(encoded, validate=True)
          print('zip_bytes', len(raw), 'sha256', hashlib.sha256(raw).hexdigest())
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              bad = z.testzip()
              print('testzip', bad)
              print('members:')
              for info in z.infolist():
                  print(info.filename, info.file_size, f'{info.CRC:08x}')
              if bad is not None:
                  raise SystemExit('Archive failed CRC at ' + bad)
              for info in z.infolist():
                  if info.filename.startswith('画像/ユースケース/quick/RX-USECASE-0054/') and info.filename.endswith('.webp'):
                      data = z.read(info.filename)
                      if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                          raise SystemExit('Invalid WebP header: ' + info.filename)
                      declared = int.from_bytes(data[4:8], 'little') + 8
                      if declared != len(data):
                          raise SystemExit(f'Invalid RIFF length {info.filename}: {declared} vs {len(data)}')
                      print('verified_webp', info.filename, len(data), hashlib.sha256(data).hexdigest())
