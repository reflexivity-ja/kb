name: Install Japanese KB assets

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore staged source visuals and clean staging
        shell: bash
        run: |
          set -euo pipefail

          cat .tmp/final-assets/chunk-*.b64 > /tmp/final-assets.b64
          base64 -d /tmp/final-assets.b64 > /tmp/final-assets.zip
          unzip -t /tmp/final-assets.zip
          unzip -o /tmp/final-assets.zip -d .

          cat .tmp/today-assets/chunk-*.b64 .tmp/today-assets/rem-*.b64 > /tmp/today-assets.b64
          base64 -d /tmp/today-assets.b64 > /tmp/today-assets.zip
          unzip -t /tmp/today-assets.zip
          unzip -o /tmp/today-assets.zip -d .

          rm -rf .tmp
          rm -f .github/workflows/install-ja-assets.yml .github/workflows/install-today-onboarding-assets.yml .github/workflows/inspect-publication-source-bundle.yml
          rm -f '画像/ユースケース/quick/RX-USECASE-0053/01.webp.b64'

          git config user.name 'Reflexivity KB automation'
          git config user.email 'gtm@reflexivity.com'
          git add -A
          git commit -m 'Restore Japanese KB source visuals and clean staging'
          git push
