name: Inspect staged Japanese KB assets

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunk boundaries
        shell: python
        run: |
          from pathlib import Path
          import string
          alphabet = set(string.ascii_letters + string.digits + '+/=')
          for group in [Path('.tmp/final-assets'), Path('.tmp/today-assets')]:
              print('GROUP', group)
              for p in sorted(group.glob('*.b64')):
                  text = p.read_text(encoding='utf-8')
                  clean = ''.join(ch for ch in text if ch in alphabet)
                  eq = [i for i,ch in enumerate(clean) if ch == '=']
                  print(p.name, 'raw', len(text), 'clean', len(clean), 'start', clean[:24], 'end', clean[-24:], 'eq_count', len(eq), 'first_eq', eq[0] if eq else None, 'last_eq', eq[-1] if eq else None)
