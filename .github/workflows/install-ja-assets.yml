name: Locate missing historical onboarding chunks

on:
  push:
    paths:
      - '.github/workflows/install-ja-assets.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search Git object history by expected SHA-256
        shell: python
        run: |
          import hashlib, subprocess

          targets = {
              '6e06018660fdd907aeb28bdb1badc49acfb471462d6c5d76957fbc545ff33ce0': 'rem-04 desired',
              'a21c3171f461406347db0c1e4cb6b32d84e91965432f338246208a40d44fa49c': 'rem-05 desired',
          }
          out = subprocess.check_output(['git','rev-list','--objects','--all'], text=True, errors='replace')
          seen = set()
          hits = 0
          for line in out.splitlines():
              if not line.strip():
                  continue
              parts = line.split(' ', 1)
              oid = parts[0]
              path = parts[1] if len(parts) > 1 else ''
              if oid in seen:
                  continue
              seen.add(oid)
              try:
                  typ = subprocess.check_output(['git','cat-file','-t',oid], text=True).strip()
                  if typ != 'blob':
                      continue
                  size = int(subprocess.check_output(['git','cat-file','-s',oid], text=True).strip())
              except Exception:
                  continue
              if size != 4000:
                  continue
              data = subprocess.check_output(['git','cat-file','blob',oid])
              sha = hashlib.sha256(data).hexdigest()
              if sha in targets:
                  print('FOUND', targets[sha], 'git_oid', oid, 'path_hint', path, 'sha256', sha)
                  hits += 1
          print('hits', hits)
          if hits != len(targets):
              print('Not all target chunks were found in reachable Git object history.')
