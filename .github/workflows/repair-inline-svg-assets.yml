name: Repair inline SVG research visuals

on:
  push:
    paths:
      - '.github/workflows/repair-inline-svg-assets.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode embedded research visuals
        shell: python
        run: |
          import base64
          import re
          from pathlib import Path

          root = Path('画像/ユースケース/quick')
          replacements = {}
          for svg in root.rglob('*.svg'):
              text = svg.read_text(encoding='utf-8')
              m = re.search(r'data:image/(webp|png|jpeg);base64,([^\"\']+)', text)
              if not m:
                  raise SystemExit(f'No embedded image payload found in {svg}')
              fmt = m.group(1)
              ext = '.jpg' if fmt == 'jpeg' else f'.{fmt}'
              out = svg.with_suffix(ext)
              out.write_bytes(base64.b64decode(m.group(2)))
              replacements[svg.as_posix()] = out.as_posix()
              svg.unlink()

          for md in Path('.').rglob('*.md'):
              text = md.read_text(encoding='utf-8')
              new = text
              for old, out in replacements.items():
                  # Markdown paths are relative, but basename replacement is sufficient here
                  new = new.replace(Path(old).name, Path(out).name)
              if new != text:
                  md.write_text(new, encoding='utf-8')

          # This is a one-shot repair workflow; remove it from the resulting repository state.
          Path('.github/workflows/repair-inline-svg-assets.yml').unlink()
      - name: Commit repaired assets
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace embedded SVG research visuals with renderable image files"
          git push
