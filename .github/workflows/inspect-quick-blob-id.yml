name: Inspect staged QUICK source visuals

on:
  push:
    paths:
      - '.github/workflows/inspect-quick-blob-id.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace target QUICK assets across git history
        shell: bash
        run: |
          set -euo pipefail
          git rev-list --objects --all > /tmp/all-objects.txt
          for id in 0049 0053 0054 0055 0057 0059; do
            echo "===== RX-USECASE-$id ====="
            grep "画像/ユースケース/quick/RX-USECASE-$id/" /tmp/all-objects.txt || true
          done

          echo '===== TARGET PATH HISTORY ====='
          git log --all --name-status --pretty='format:COMMIT %H %s' -- '画像/ユースケース/quick/RX-USECASE-0049/**' '画像/ユースケース/quick/RX-USECASE-0053/**' '画像/ユースケース/quick/RX-USECASE-0054/**' '画像/ユースケース/quick/RX-USECASE-0055/**' '画像/ユースケース/quick/RX-USECASE-0057/**' '画像/ユースケース/quick/RX-USECASE-0059/**' || true
