name: Restore verified RX-USECASE-0053 source visual

on:
  push:
    paths:
      - '.github/workflows/inspect-quick-blob-id.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify source visual
        shell: bash
        run: |
          set -euo pipefail
          target='画像/ユースケース/quick/RX-USECASE-0053/source-visuals.webp'
          mkdir -p "$(dirname "$target")"
          git show '2f0588384e3f5c684dbd1a587096b3525e151d58:画像/ユースケース/quick/RX-USECASE-0053/01.webp.b64' | tr -d '\r\n' | base64 -d > "$target"

          file "$target" | grep -q 'Web/P image'
          python - <<'PY'
          from pathlib import Path
          p = Path('画像/ユースケース/quick/RX-USECASE-0053/source-visuals.webp')
          data = p.read_bytes()
          assert data[:4] == b'RIFF', data[:16]
          assert data[8:12] == b'WEBP', data[:16]
          expected = int.from_bytes(data[4:8], 'little') + 8
          assert expected == len(data), (expected, len(data))
          print('Verified WebP bytes:', len(data))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'No asset change needed.'
            exit 0
          fi
          git commit -m 'Restore RX-USECASE-0053 source visual'
          git push

# Triggered for verified restoration on 2026-09-16.
