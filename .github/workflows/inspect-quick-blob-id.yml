name: Inspect staged QUICK source visuals

on:
  push:
    paths:
      - '.github/workflows/inspect-quick-blob-id.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged source visuals
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn imagemagick

          echo '===== STAGED BLOB HASHES ====='
          for f in .tmp/blob-id/*.webp; do
            printf '%s\t' "$f"
            git hash-object "$f"
          done

          echo '===== OCR ====='
          mkdir -p /tmp/quick-ocr
          for f in .tmp/blob-id/*.webp; do
            echo "===== $f ====="
            file "$f"
            identify "$f" || true
            out="/tmp/quick-ocr/$(basename "$f")-up.png"
            convert "$f" -resize 400% -colorspace Gray -contrast-stretch 1%x1% -sharpen 0x1 "$out"
            echo '--- OCR jpn+eng psm6 ---'
            tesseract "$out" stdout -l jpn+eng --psm 6 2>/dev/null | head -n 160 || true
            echo '--- OCR jpn+eng psm11 ---'
            tesseract "$out" stdout -l jpn+eng --psm 11 2>/dev/null | head -n 160 || true
          done
