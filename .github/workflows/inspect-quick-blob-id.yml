name: Inspect staged QUICK source visuals

on:
  push:
    paths:
      - '.github/workflows/inspect-quick-blob-id.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WebP blobs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          for f in .tmp/blob-id/*.webp; do
            echo "===== $f ====="
            file "$f"
            if command -v identify >/dev/null 2>&1; then
              identify "$f" || true
            fi
            echo "--- OCR ---"
            tesseract "$f" stdout -l eng 2>/dev/null | head -n 80 || true
          done
