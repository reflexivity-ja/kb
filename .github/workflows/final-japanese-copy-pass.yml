name: Final Japanese copy pass

on:
  push:
    paths:
      - '.github/workflows/final-japanese-copy-pass.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove publication wrappers and finish Japanese copy
        shell: python
        run: |
          from pathlib import Path
          import re

          for p in Path('ユースケース').rglob('*.md'):
              t = p.read_text(encoding='utf-8')
              # Partner attribution is already visible in the metadata directly under the title.
              # Do not interrupt the original email/question narrative with another wrapper heading.
              t = t.replace('\n## QUICK提供コンテンツ\n', '\n')
              t = t.replace('\n## QUICK提供内容\n', '\n')

              # Customer-facing structural headings should read as Japanese.
              heading_repl = {
                  '## Executive Summary': '## 要約',
                  '## Market Overview': '## 市場概況',
                  '## Market Context': '## 市場環境',
                  '## Performance Summary': '## パフォーマンス概要',
                  '## Key Takeaways': '## 主なポイント',
                  '## Key Findings': '## 主な結果',
                  '## Analysis': '## 分析',
                  '## Scenario Analysis': '## シナリオ分析',
                  '## Investment Implications': '## 投資上の示唆',
                  '## Risks': '## リスク',
                  '## Risk Factors': '## リスク要因',
                  '## What to Watch': '## 今後の注目点',
                  '## Conclusion': '## 結論',
                  '## Sources': '## 情報源',
              }
              for a, b in heading_repl.items():
                  t = t.replace(a, b)
              p.write_text(t, encoding='utf-8')

          reflexivity_docs = [
              Path('ユースケース/運用資産別/債券/french-sovereign-corporate-yield-inversion-trade-ideas.md'),
              Path('ユースケース/運用資産別/債券/us-yield-curve-relative-value-screen.md'),
              Path('ユースケース/運用資産別/債券/us-2s10s-recession-signal-validation.md'),
              Path('ユースケース/運用資産別/FX/eurusd-systematic-investment-checklist.md'),
              Path('ユースケース/運用資産別/マルチアセット/bond-signals-vs-forward-equity-returns.md'),
              Path('ユースケース/運用資産別/マルチアセット/hawkish-policy-beneficiaries-knowledge-graph.md'),
              Path('ユースケース/運用資産別/マクロ/challenge-strong-us-economy-thesis.md'),
              Path('ユースケース/運用資産別/マクロ/market-narrative-vs-hard-data-breadth.md'),
              Path('ユースケース/運用資産別/FX/eurusd-rsi-walk-forward-backtest.md'),
          ]
          for p in reflexivity_docs:
              t = p.read_text(encoding='utf-8')
              for a, b in [
                  ('Researchでは', '調査では'),
                  ('Researchは', '調査では'),
                  ('Researchが', '調査が'),
                  ('Researchを', '調査を'),
                  ('Researchの', '調査の'),
                  ('Researchです', '調査です'),
                  ('Walk-forward分析', 'ウォークフォワード分析'),
                  ('Robustness検証', '頑健性検証'),
                  ('Knowledge Graph、', 'ナレッジグラフ、'),
                  ('Full 18-gridは原資料画像にそのまま残しています。\n', ''),
              ]:
                  t = t.replace(a, b)
              p.write_text(t, encoding='utf-8')

          Path('.github/workflows/final-japanese-copy-pass.yml').unlink()
      - name: Commit final copy pass
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish Japanese public copy and remove partner wrapper headings"
          git push
