name: Install today onboarding assets

on:
  push:
    paths:
      - '.github/workflows/install-today-onboarding-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and install WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/today-assets/chunk-00.b64 \
            .tmp/today-assets/chunk-01.b64 \
            .tmp/today-assets/chunk-02.b64 \
            .tmp/today-assets/chunk-03.b64 \
            .tmp/today-assets/rem-00.b64 \
            .tmp/today-assets/rem-01.b64 \
            .tmp/today-assets/rem-02.b64 \
            .tmp/today-assets/rem-03.b64 \
            .tmp/today-assets/rem-04.b64 \
            .tmp/today-assets/rem-05.b64 \
            .tmp/today-assets/rem-06.b64 \
            .tmp/today-assets/rem-07.b64 > /tmp/today-assets.b64
          base64 -d /tmp/today-assets.b64 > /tmp/today-assets.zip
          unzip -t /tmp/today-assets.zip
          unzip -o /tmp/today-assets.zip -d .
          rm -f '画像/ユースケース/quick/RX-USECASE-0053/01.webp.b64'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '画像/ユースケース/quick/RX-USECASE-0053' '画像/ユースケース/quick/RX-USECASE-0054'
          git add -u '画像/ユースケース/quick/RX-USECASE-0053'
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'Restore Sep 16 onboarding source visuals'
            git push
          fi
