name: Install today onboarding assets

on:
  push:
    paths:
      - '.github/workflows/install-today-onboarding-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore staged WebP source visuals
        shell: python
        run: |
          from pathlib import Path
          import base64, io, subprocess, zipfile

          root = Path('.tmp/today-assets')
          groups = [
              sorted(root.glob('chunk-*.b64')),
              sorted(root.glob('rem-*.b64')),
          ]
          installed = []
          for i, parts in enumerate(groups, 1):
              if not parts:
                  continue
              encoded = b''.join(p.read_bytes() for p in parts)
              raw = base64.b64decode(encoded, validate=True)
              z = zipfile.ZipFile(io.BytesIO(raw))
              print(f'Bundle {i}:')
              for name in z.namelist():
                  print(name)
                  installed.append(name)
              z.extractall('.')
          if not installed:
              raise SystemExit('No source visuals installed')

          bad = Path('画像/ユースケース/quick/RX-USECASE-0053/01.webp.b64')
          if bad.exists():
              bad.unlink()
          for p in root.glob('*'):
              if p.is_file():
                  p.unlink()
          root.rmdir()
          parent = Path('.tmp')
          if parent.exists() and not any(parent.iterdir()):
              parent.rmdir()

          Path('.github/workflows/install-ja-assets.yml').unlink(missing_ok=True)
          Path('.github/workflows/install-today-onboarding-assets.yml').unlink(missing_ok=True)

          subprocess.run(['git','config','user.name','Reflexivity KB automation'], check=True)
          subprocess.run(['git','config','user.email','gtm@reflexivity.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','Restore Sep 16 source visuals and clean staging'], check=True)
          subprocess.run(['git','push'], check=True)
