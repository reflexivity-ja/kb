name: Localize and blend public research pages

on:
  push:
    paths:
      - '.github/workflows/localize-and-blend-publication.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localize headings and blend Reflexivity figures into the narrative
        shell: python
        run: |
          from pathlib import Path
          import re

          exact = {
              '## Researchの起点': '## 調査の起点',
              '## Researchの狙い': '## 調査の狙い',
              '## Researchの問い': '## 調査の問い',
              '## Researchの出発点': '## 調査の出発点',
              '## 原Researchの構成': '## 元の調査の構成',
              '## 原Researchの図表': '## 元の調査の図表',
              '## 原Researchの出力イメージ': '## 元の調査',
              '## Fixed Incomeでの4つの表現': '## 債券での4つの表現',
              '## Cross-Assetへ展開': '## クロスアセットへの展開',
              '## Relative Value / Volatilityまで拡張': '## 相対価値・ボラティリティへの展開',
              '## Risk Management': '## リスク管理',
              '## 元資料のLead Time別結果': '## 元資料の先行期間別結果',
              '## 元Researchが提案したFollow-up': '## 元の調査が提案した追加検証',
              '## Scatter Plotの作り方': '## 散布図の作り方',
              '## Markerの意味': '## 最新値マーカーの意味',
              '## I. Positioning': '## I. ポジショニング',
              '## II. Economic Fundamentals': '## II. 経済ファンダメンタルズ',
              '### PMI Spread': '### PMI格差',
              '### Employment / Inflation': '### 雇用とインフレ',
              '## III. Interest-Rate Differential': '## III. 金利差',
              '### Rate Differential Regression': '### 金利差回帰',
              '## IV. Valuation / Terms of Trade': '## IV. バリュエーションと交易条件',
              '## V. Risk Sentiment / Volatility': '## V. リスクセンチメントとボラティリティ',
              '## VI. Central Bank Policy': '## VI. 中央銀行政策',
              '## VII. Technical': '## VII. テクニカル分析',
              '## VIII. Scenario Analysis': '## VIII. シナリオ分析',
              '## 原資料のSummary Assessment': '## 元資料の総合評価',
              '## 1st Order: Macro Channel': '## 一次効果: マクロの伝達経路',
              '## 2nd Order: Sector': '## 二次効果: セクター',
              '## 3rd Order: Named Companies': '## 三次効果: 企業',
              '## Sankeyの読み方': '## サンキー図の読み方',
              '## 5つのDimension': '## 5つの検証軸',
              '### 1. Private Demand vs Headline GDP': '### 1. 民間需要とヘッドラインGDP',
              '### 2. Labor & Real Wages': '### 2. 労働市場と実質賃金',
              '### 3. Surveys / PMI': '### 3. 景況感指標とPMI',
              '### 4. Credit & Delinquencies': '### 4. 信用環境と延滞率',
              '### 5. Rates & Transmission': '### 5. 金利と金融政策の波及',
              '## 5-Dimension Scorecard': '## 5つの検証軸の評価',
              '## Probability-weighted Cycle Assessment': '## 確率加重した景気局面の評価',
              '## Bottom Line': '## 結論',
              '## 3つの大きなDivergence': '## 3つの大きな乖離',
              '### 1. Labor: Headline vs Breadth': '### 1. 雇用: ヘッドラインと広がり',
              '### 2. Fed Path: Pricing vs Benign Disinflation Narrative': '### 2. 金融政策見通し: 市場織り込みとディスインフレ期待',
              '### 3. Equity Leadership: Index High vs Narrow Internals': '### 3. 株式のけん引役: 指数高値と内部の狭さ',
              '## 60-Day Scorecard': '## 直近60日の評価',
              '## Supporting Signals': '## 補足シグナル',
              '## 実際に行ったBacktest': '## 実際に行ったバックテスト',
              '## Key Findings': '## 主な結果',
              '## Walk-forwardの代表例': '## ウォークフォワード分析の代表例',
              '## Method': '## 検証方法',
              '## Full-Sample Results': '## 全期間の結果',
              '## Current Snapshot': '## 足元の状況',
              '## Limitations': '## 分析上の留意点',
              '## Data Limitations': '## データ上の留意点',
              '## Important Data Limitation': '## 重要なデータ上の留意点',
              '## Limitations & Caveats': '## 前提・留意点',
              '## 既知の限界': '## 分析上の留意点',
              '## 限界・留意点': '## 分析上の留意点',
          }

          generic = [
              ('Research Workflow', '調査プロセス'), ('Research workflow', '調査プロセス'),
              ('Researchの', '調査の'), ('原Research', '元の調査'), ('元Research', '元の調査'),
              ('Key Findings', '主な結果'), ('Walk-forward', 'ウォークフォワード'),
              ('Backtest', 'バックテスト'), ('Scatter Plot', '散布図'),
              ('Follow-up', '追加検証'), ('Lead Time', '先行期間'),
              ('Risk Management', 'リスク管理'), ('Fixed Income', '債券'),
              ('Cross-Asset', 'クロスアセット'), ('Relative Value', '相対価値'),
              ('Volatility', 'ボラティリティ'), ('Bottom Line', '結論'),
              ('Supporting Signals', '補足シグナル'), ('Knowledge Graph', 'ナレッジグラフ'),
              ('Knowledge graph', 'ナレッジグラフ'),
          ]

          def localize_headings(text):
              out = []
              for line in text.splitlines():
                  if re.match(r'^#{1,6}\s+', line):
                      line = exact.get(line, line)
                      for old, new in generic:
                          line = line.replace(old, new)
                  out.append(line)
              text = '\n'.join(out)
              text = text.replace('Research workflow', '調査プロセス').replace('Research Workflow', '調査プロセス')
              text = text.replace('どこにLimitationsを置いたか', 'どの前提・留意点を明示したか')
              text = text.replace('Limitationsを置いたか', '前提・留意点を明示したか')
              return text

          docs = {
              '0029': Path('ユースケース/運用資産別/債券/french-sovereign-corporate-yield-inversion-trade-ideas.md'),
              '0030': Path('ユースケース/運用資産別/債券/us-yield-curve-relative-value-screen.md'),
              '0031': Path('ユースケース/運用資産別/債券/us-2s10s-recession-signal-validation.md'),
              '0032': Path('ユースケース/運用資産別/FX/eurusd-systematic-investment-checklist.md'),
              '0033': Path('ユースケース/運用資産別/マルチアセット/bond-signals-vs-forward-equity-returns.md'),
              '0034': Path('ユースケース/運用資産別/マルチアセット/hawkish-policy-beneficiaries-knowledge-graph.md'),
              '0035': Path('ユースケース/運用資産別/マクロ/challenge-strong-us-economy-thesis.md'),
              '0036': Path('ユースケース/運用資産別/マクロ/market-narrative-vs-hard-data-breadth.md'),
              '0037': Path('ユースケース/運用資産別/FX/eurusd-rsi-walk-forward-backtest.md'),
          }

          # Remove the gallery-like wrapper at the top. Figures are reinserted where they belong in the narrative.
          gallery = re.compile(r'\n## (?:原Research|元の調査)の(?:図表|構成)\n.*?(?=\n## )', re.S)
          for rid, path in docs.items():
              text = path.read_text(encoding='utf-8')
              text = gallery.sub('\n', text, count=1)
              text = localize_headings(text)
              path.write_text(text, encoding='utf-8')

          # 0031: first show the curve relationship, then the recession-history validation.
          path = docs['0031']
          text = path.read_text(encoding='utf-8')
          anchor = '## 元資料の先行期間別結果\n'
          if anchor in text and 'chart-1.webp' not in text:
              insert = (
                  'まず、2年・10年金利差を長期系列の中に置き、その後のカーブ変化と並べて確認します。\n\n'
                  '![2年・10年金利差とその後のカーブ変化](../../../画像/ユースケース/reflexivity/RX-USECASE-0031/chart-1.webp)\n\n'
                  '*2年・10年金利差と、その後の5年・10年のカーブ変化を比較した元の調査の図表。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          anchor = '## 景気後退ごとの検証\n'
          if anchor in text and 'chart-2.webp' not in text:
              insert = (
                  '次に、実際の景気後退局面とシグナルの出方を時系列で重ね、見逃しと偽陽性の両方を確認します。\n\n'
                  '![景気後退シグナルの履歴検証](../../../画像/ユースケース/reflexivity/RX-USECASE-0031/chart-2.webp)\n\n'
                  '*景気後退シグナルを履歴上で検証した元の調査の図表。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 0033: place the scatter plot immediately after the construction method.
          path = docs['0033']
          text = path.read_text(encoding='utf-8')
          anchor = '## 元の調査の読み\n'
          if anchor in text and 'chart-1.webp' not in text:
              insert = (
                  'この設定で1,244個の観測値を散布図にすると、最新値が過去分布のどこに位置するかと、同じ水準で将来リターンがどれほどばらついたかを同時に見られます。\n\n'
                  '![債券シグナルと株式の先行リターン](../../../画像/ユースケース/reflexivity/RX-USECASE-0033/chart-1.webp)\n\n'
                  '*債券市場のシグナルと、その後の株式リターンを観測値ごとに比較した散布図。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 0034: show the Knowledge Graph as the story moves from sectors to named companies.
          path = docs['0034']
          text = path.read_text(encoding='utf-8')
          anchor = '## 三次効果: 企業\n'
          if anchor in text and 'chart-1.webp' not in text:
              insert = (
                  '政策ショックからテーマ、セクター、企業へとつながる経路は、ナレッジグラフ上では次のように可視化されます。\n\n'
                  '![ナレッジグラフによる波及経路](../../../画像/ユースケース/reflexivity/RX-USECASE-0034/chart-1.webp)\n\n'
                  '*タカ派的な政策ショックが、テーマやセクターを経由して企業へ波及する経路。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 0035: figures summarize the five evidence axes just before the probability assessment.
          path = docs['0035']
          text = path.read_text(encoding='utf-8')
          anchor = '## 確率加重した景気局面の評価\n'
          if anchor in text and 'source-figures.webp' not in text:
              insert = (
                  'ここまでの需要、雇用、実質所得、景況感、信用・金利の証拠を並べると、元の調査では次の図表と確率評価に集約されました。\n\n'
                  '![米国景気の強さを反証方向から検証した主要図表](../../../画像/ユースケース/reflexivity/RX-USECASE-0035/source-figures.webp)\n\n'
                  '*元の調査で用いた主要比較図と、景気局面の確率評価。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 0036: figures appear where news narrative and hard data are brought together.
          path = docs['0036']
          text = path.read_text(encoding='utf-8')
          anchor = '## 直近60日の評価\n'
          if anchor in text and 'source-figures.webp' not in text:
              insert = (
                  'ニュースの語り口と、実際の経済指標・テーマ別リターンを横に並べると、どこまで同じ方向を向いているかが見えやすくなります。\n\n'
                  '![市場ナラティブとハードデータの主要図表](../../../画像/ユースケース/reflexivity/RX-USECASE-0036/source-figures.webp)\n\n'
                  '*経済指標の実績対コンセンサスと、テーマ別の1カ月リターンを比較した元の調査の図表。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 0037: chart follows the findings and leads into the walk-forward table.
          path = docs['0037']
          text = path.read_text(encoding='utf-8')
          anchor = '## ウォークフォワード分析の代表例\n'
          if anchor in text and 'chart-1.webp' not in text:
              insert = (
                  '全期間で最も良く見える組み合わせも、買い持ちとの比較やアウト・オブ・サンプルでの崩れ方まで一緒に見る必要があります。\n\n'
                  '![EUR/USD RSI戦略と買い持ちの比較](../../../画像/ユースケース/reflexivity/RX-USECASE-0037/chart-1.webp)\n\n'
                  '*RSI-14・20/80・crossback戦略のネット成長率とEUR/USDの買い持ちを比較した元の調査の図表。*\n\n'
              )
              text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # Final heading cleanup across all customer-facing use cases and guides.
          for root in [Path('ユースケース'), Path('利用ガイド')]:
              if not root.exists():
                  continue
              for path in root.rglob('*.md'):
                  text = localize_headings(path.read_text(encoding='utf-8'))
                  path.write_text(text.rstrip() + '\n', encoding='utf-8')

          Path('.github/workflows/localize-and-blend-publication.yml').unlink()

      - name: Commit publication cleanup
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Blend research figures into narrative and localize Japanese headings"
          git push
