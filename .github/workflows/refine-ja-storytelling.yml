name: Refine Japanese storytelling

on:
  push:
    paths:
      - '.github/workflows/refine-ja-storytelling.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine narrative flow and Japanese wording
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('ユースケース')

          # Publication scaffolding should not interrupt the source story.
          for md in root.rglob('*.md'):
              text = md.read_text(encoding='utf-8')
              text = text.replace('\n### 元資料の図表・画面\n', '\n')
              text = text.replace('\n## 元資料の図表・画面\n', '\n')
              text = text.replace('\n### 元資料の図表\n', '\n')
              text = text.replace('\n## 元資料の図表\n', '\n')
              text = text.replace('\n## QUICK提供コンテンツ\n', '\n')
              text = text.replace('元資料で本文中に掲載されていた図表・画面を、登場順にまとめて掲載しています。\n\n', '')
              text = text.replace('元資料に掲載されていた画面・図表を、登場順を保って掲載しています。\n\n', '')
              md.write_text(text, encoding='utf-8')

          # RX-USECASE-0035: keep the technical facts, but make the Japanese publication copy natural.
          p = Path('ユースケース/運用資産別/マクロ/challenge-strong-us-economy-thesis.md')
          t = p.read_text(encoding='utf-8')
          repl = {
              'Net ExportとInventoryが見出しを押し下げており、Domestic Demandは見出しより強い。': '純輸出と在庫がGDPの総合値を押し下げており、国内民間需要は総合値より強い。',
              '原資料のBreakeven目安': '雇用を維持するための目安',
              '実質賃金 Growth': '実質賃金の前年比伸び率',
              'Unemployment': '失業率',
              'ここを「最も明確なCrack」と評価しています。': 'ここを景気の強さに現れた「最も明確なほころび」と評価しています。',
              'Expansion域ではあるがMomentumは低下': '拡張圏にはあるものの、勢いは低下',
              'Credit Stressはまだ中心リスクではない': '信用ストレスはまだ中心的なリスクではない',
              'CurveはDis-invertしたが、Real RateがRestrictiveで、過去のTightening Lagが残る': 'イールドカーブの逆転は解消したものの、実質金利はなお引き締め的で、過去の金融引き締めの遅行効果が残る',
              '| 民間需要 | + Supportive | 見出し GDPよりPrivate Coreが強い |': '| 民間需要 | 支持材料 | GDPの総合値より民間需要の中身が強い |',
              '| Labor & 実質賃金s | - Softening | Hiringと実質賃金が弱い |': '| 雇用・実質賃金 | 弱含み | 採用と実質賃金が弱い |',
              '| Surveys / PMI | ~ Expansion, easing | 50超だが高度低下 |': '| 景況感・PMI | 拡張圏だが鈍化 | 50を上回るが勢いは低下 |',
              '| Credit | + No stress yet | Standards / DelinquencyはまだStressでない |': '| 信用環境 | まだ大きなストレスなし | 融資基準・延滞率に強い悪化は見られない |',
              '| Rates & Transmission | - Restrictive | Real RateとLagが重石 |': '| 金利・政策波及 | 引き締め的 | 実質金利と遅行効果が重石 |',
              'Policy-sensitiveになっている': '金融政策の影響を受けやすくなっている',
              'ISM / NFIB等の一部SeriesがLicensed Feedで取得できず、Survey Coverageに制約があること、Quarterly 民間需要がRevisionを受けること、Regional Fed Surveyを個別に取れなかったこと': 'ISMやNFIBなど一部系列をライセンス付きデータから取得できず景況感指標の網羅性に限界があること、四半期の民間需要は改定され得ること、地区連銀調査を個別には取得できなかったこと',
          }
          for a,b in repl.items(): t=t.replace(a,b)
          p.write_text(t, encoding='utf-8')

          # RX-USECASE-0036: Japanese headings and a Japanese narrative, while preserving the numbers and source logic.
          p = Path('ユースケース/運用資産別/マクロ/market-narrative-vs-hard-data-breadth.md')
          t = p.read_text(encoding='utf-8')
          repl = {
              '# 市場ナラティブとハードデータの乖離を複数市場から検証する': '# 市場の語りと実データの乖離を複数市場から検証する',
              '**「Strong US Economy」という市場の語りは、本当に幅広い証拠に支えられて広がりしているのか、それとも一部の強い見出しに依存しているのか。**': '**「米国景気は強い」という市場の語りは、本当に幅広い証拠に支えられて裾野が広がっているのか、それとも一部の強い見出しに依存しているのか。**',
              'Macro News、Fed関連情報、予測市場、株式テーマのけん引構造、実データを一つの評価表': 'マクロ関連ニュース、FRB関連情報、予測市場、株式テーマのけん引構造、実データを一つの評価表',
              '実データはMixed、予測市場はCleanなGrowthよりInflation/Hike Riskを意識し、Equity Leadershipは集中している': '実データは強弱が入り混じり、予測市場は素直な成長シナリオよりインフレや追加利上げのリスクを意識し、株式市場のけん引役も集中している',
              '- August Payroll: **162k vs 56k expected**': '- 8月雇用者数: **16.2万人（市場予想5.6万人）**',
              '- Private ADP Hiring: **38k**': '- ADP民間雇用: **3.8万人**',
              '- Hold: **50.5%**': '- 据え置き: **50.5%**',
              '- 25bp Hike: **49.5%**': '- 25bp利上げ: **49.5%**',
              '- Cut: **約0.5%**': '- 利下げ: **約0.5%**',
              'Soft/Strong Economyの市場の語りならEasing期待が強まるはずなのに、市場はむしろ追加Tighteningの可能性を織り込んでいる点をContradictionとしています。': '景気が強いまま物価が落ち着くという語りなら緩和期待が強まるはずですが、市場はむしろ追加引き締めの可能性を織り込んでおり、そこに矛盾があると見ています。',
              '- 1か月Theme PerformanceのLeader-to-Laggard Gap: **48pt**（+33.4%〜-14.7%）': '- 1か月のテーマ別騰落率で、首位と最下位の差は **48ポイント**（+33.4%〜-14.7%）',
              '- 調査したThemeのうち**10テーマがNegative**': '- 調査対象のうち**10テーマがマイナス**',
              'Indexは高値圏でも内部Breadthが広がっていない': '指数は高値圏でも市場内部の広がりが伴っていない',
              '| Labor | Hot Payroll | ADP / broader gauge softer | Narrow |': '| 雇用 | 雇用者数は強い | ADPなど広い指標は弱い | 広がりは限定的 |',
              '| Fed / 予測市場s | Benign, cuts coming | Hold/Hikeほぼ五分、Core PCE 3.3% | Contradicted |': '| FRB・予測市場 | 利下げ期待 | 据え置きと利上げがほぼ五分、コアPCE 3.3% | 矛盾 |',
              '| Equity Leadership | Broad rally | 48pt dispersion、10 themes negative | Narrow |': '| 株式のけん引構造 | 幅広い上昇 | 48ポイントの格差、10テーマがマイナス | 広がりは限定的 |',
              '| News Tone | Strong Economy | Hike/Inflation-risk framingが約3.5倍 | Cautious |': '| ニュースの論調 | 景気は強い | 利上げ・インフレ懸念の見出しが約3.5倍 | 慎重 |',
              '| Manufacturing / Growth | Expansion intact | ISM New Orders 56.0→53.7、Retail Sales低下 | Decelerating |': '| 製造業・成長 | 拡張継続 | ISM新規受注 56.0→53.7、小売売上高も低下 | 減速 |',
              '| EOY State | Soft Landing | Soft Landing 55%、Overheating 42.5% | Split |': '| 年末時点の景気像 | ソフトランディング | ソフトランディング55%、過熱42.5% | 見方が割れる |',
              '30件のMacro 見出し Sampleでは、Strong-dataより**Hike / Inflation-risk framingが約3.5倍**': '30件のマクロ関連ニュース見出しでは、強い経済指標を強調するものより**利上げ・インフレリスクを強調するものが約3.5倍**',
              'Initial Jobless Claims **206k**、Unemployment **4.1%**はStabilizerとして残る': '新規失業保険申請 **20.6万件**、失業率 **4.1%**は景気を支える材料として残る',
              'Document Index': '文書インデックス',
              'Calendar / News': '経済カレンダーやニュース',
              'Equity Theme名が匿名化され、Named SectorではなくReturn DispersionでBreadthを測定': '株式テーマ名が匿名化されているため、個別セクター名ではなく騰落率のばらつきで市場の広がりを測定',
              'News ToneはKeyword-based 見出し Tallyで、校正済みSentiment Scoreではない': 'ニュースの論調はキーワードに基づく見出し件数であり、校正済みのセンチメント指標ではない',
              'Economic Calendar SurpriseはTool Range制約により直近週中心': '経済指標の予想比サプライズは、取得範囲の制約から直近週が中心',
              '**Macro Data・Rates・Equity Internals・予測市場を同じ問いの下で横断する**': '**マクロデータ・金利・株式市場内部・予測市場を同じ問いの下で横断する**',
          }
          for a,b in repl.items(): t=t.replace(a,b)
          p.write_text(t, encoding='utf-8')

          # RX-USECASE-0037: Japanese methodology labels; keep standard market acronyms such as RSI and OOS.
          p = Path('ユースケース/運用資産別/FX/eurusd-rsi-walk-forward-backtest.md')
          t = p.read_text(encoding='utf-8')
          repl = {
              'EUR/USD Spotで、Pure RSI Mean-Reversion Strategyを2年間検証。以下を総当たりしています。': 'EUR/USDのスポットレートで、RSIだけを使う平均回帰戦略を2年間検証し、以下の条件を総当たりしています。',
              '- Lookback:': '- 参照期間:',
              '- Threshold:': '- しきい値:',
              '- Rule:': '- 売買ルール:',
              '- 合計 **18 combinations**': '- 合計 **18通りの組み合わせ**',
              '- 取引コスト: **1 pip round-trip**': '- 取引コスト: **往復1 pip**',
              '- 1年目をCalibration、2年目をOut-of-sampleとするWalk-forward': '- 1年目を調整期間、2年目をアウト・オブ・サンプル検証期間とするウォークフォワード分析',
              'EUR/USD SeriesはDaily Barのみ': 'EUR/USDの系列は日足のみ',
              '**4時間足を合成・捏造せず、Dailyだけで実行した**': '**4時間足を合成・捏造せず、日足だけで実行した**',
              '**Medium Lookbackが最も安定**。Short LookbackはTurnoverが高くNoiseが多く、Long LookbackはTrade数が少ない。': '**中程度の参照期間が最も安定**。短い参照期間は売買回転が高くノイズが多い一方、長い参照期間は取引回数が少ない。',
              '**ウォークフォワードでOverfittingが露出**。Calibration BestのSharpe': '**ウォークフォワードで過剰適合が露出**。調整期間で最良だった組み合わせのシャープレシオ',
              'Degradation': '低下幅',
              'このSampleではCost Impactは平均でCAGR約': 'このサンプルでは取引コストの影響は平均でCAGR約',
              '問題はCostよりEdgeの弱さ': '問題はコストより戦略優位性の弱さ',
              'Full WindowのBest ComboでもNet CAGR': '全期間で最良の組み合わせでもネットCAGR',
              '絶対的なEdge': '絶対的な優位性',
              '## ウォークフォワード分析の代表例': '## ウォークフォワード検証の代表例',
              '## 検証方法': '## 分析方法',
              '- Window: **520 daily bars**': '- 対象期間: **日足520本**',
              '- Walk-forward split:': '- ウォークフォワードの分割日:',
              '- Touch Rule: Oversold以下でLong、Overbought以上でShort': '- タッチ方式: 売られ過ぎ水準以下でロング、買われ過ぎ水準以上でショート',
              '- Crossback Rule: Thresholdを再び跨いだところでEntryしMidlineでExit': '- クロスバック方式: しきい値を戻って跨いだところで入り、中立線で手仕舞う',
              '- SignalはNext BarでTradeし、Look-aheadを避ける': '- シグナルの次の足で売買し、先読みを避ける',
              '- Daily-only。4h legは未実行': '- 日足のみで、4時間足の検証は未実施',
              '- 2年はParameter Sweepとして短い': '- 2年間はパラメータの総当たり検証としては短い',
              '- Sparse Signal ComboのHit Rate / Avg Win-Lossは観測数が少ない': '- シグナルが少ない組み合わせでは、勝率や平均損益の観測数が少ない',
              '- Slippage、Financing、Position Sizingは含まない': '- スリッページ、資金調達コスト、ポジションサイズ調整は含まない',
              '- Costが広いExecution環境ではShort-lookback / High-turnover Strategyから悪化しやすい': '- 実際の取引コストが大きい環境では、短い参照期間・高回転の戦略から悪化しやすい',
              '「良いBacktestを探す」': '「良いバックテストを探す」',
              '**OOSで崩れるかを見て、戦略の弱さを発見する**': '**アウト・オブ・サンプルで崩れるかを見て、戦略の弱さを発見する**',
          }
          for a,b in repl.items(): t=t.replace(a,b)
          p.write_text(t, encoding='utf-8')

          # QUICK RX-USECASE-0038: keep the question -> visual evidence -> interpretation flow, not a publication-image section.
          p = Path('ユースケース/運用資産別/株式/us-japan-market-leading-themes.md')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('## チャート・データ概観\n\n日米トップ銘柄 正規化パフォーマンス比較\n\n', '## まず、日米の値動きを同じ尺度で比べる\n\n最初に、日米のトップ銘柄を同じ起点で正規化し、どちらの市場で何が上昇をけん引していたのかを並べて見ます。\n\n')
              t = t.replace('\n米国セクターETFパフォーマンスランキング\n日本主要銘柄パフォーマンスランキング（全銘柄）\nAI・半導体テーマ：日米企業パフォーマンス比較\n産業自動化テーマ：日米企業パフォーマンス比較\n', '\nこの図表では、米国セクターETF、日本の主要銘柄、AI・半導体、産業自動化まで順に見比べています。ここから、単に上昇率を比べるのではなく、**同じテーマが両市場に存在するのか、存在しても主役が違うのか**を掘り下げます。\n')
              t = t.replace('### テーマ別 日米比較サマリー', '### テーマ別の日米比較')
              p.write_text(t, encoding='utf-8')

          Path('.github/workflows/refine-ja-storytelling.yml').unlink()

      - name: Commit storytelling refinements
        run: |
          git config user.name "Reflexivity KB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refine Japanese narration and blend visuals into source story"
          git push
